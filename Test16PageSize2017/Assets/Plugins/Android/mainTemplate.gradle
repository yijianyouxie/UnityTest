apply plugin: 'com.android.application'

ext {
        commonVersions = [
            compileSdkVersion: 30,
            buildToolsVersion: '28.0.3',
            minSdkVersion    : 15,
            targetSdkVersion : 30,
            supportLibVersion : '28.0.0',
        ]

        commonDependencies = [
            "support-v4" : "com.android.support:support-v4:${commonVersions.supportLibVersion}",
            "appcompat-v7" : "com.android.support:appcompat-v7:${commonVersions.supportLibVersion}",
            "design" : "com.android.support:design:${commonVersions.supportLibVersion}",
            "recyclerview-v7" : "com.android.support:recyclerview-v7:${commonVersions.supportLibVersion}",
            ]
		android = [
			supportVersion : "${commonVersions.supportLibVersion}",
		]
		androidSupportDependencies = [
				annotations: "com.android.support:support-annotations:${android.supportVersion}",
				v4         : "com.android.support:support-v4:${android.supportVersion}",
				appCompat  : "com.android.support:appcompat-v7:${android.supportVersion}",
				design     : "com.android.support:design:${android.supportVersion}",
				customtabs : "com.android.support:customtabs:${android.supportVersion}",
				cardview   : "com.android.support:cardview-v7:${android.supportVersion}"
		]
		presentationDependencies = [
				recyclerView: "com.android.support:recyclerview-v7:${android.supportVersion}",
		]
        //ADD_ROOT_TAG
    }

dependencies {
	implementation 'com.android.support:multidex:1.0.3'
	implementation fileTree(dir: 'libs', include: ['*.jar'])
**DEPS**}

android {
	compileSdkVersion 30
	buildToolsVersion '30.0.0'


     // for MSDKLine support java8
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

	defaultConfig {
		minSdkVersion 21
		targetSdkVersion 30
		applicationId '**APPLICATIONID**'
		ndk {
            abiFilters **ABIFILTERS**
        }
		versionCode	**VERSIONCODE**
		versionName	'**VERSIONNAME**'
		
        manifestPlaceholders = [
            HW_APPID: "100005625",
            HONOR_APPID: "104423134",
            VIVO_APPKEY: "6492dddaa3a198a84ff1902270d302f3",
            VIVO_APPID: "100091198",
            PACKAGE_NAME: "com.tencent.tmgp.tstl",
            //ManifestPlaceholders
        ]
		multiDexEnabled true
	}

	lintOptions {
		abortOnError false
	}

	aaptOptions {
		noCompress '.unity3d', '.ress', '.resource', '.obb', '.mp4', '.db', '.so', '.ver'
	}

**SIGN**
	buildTypes {
  		debug {
 			minifyEnabled **MINIFY_DEBUG**
 			useProguard **PROGUARD_DEBUG**
 			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-unity.txt'**USER_PROGUARD**
  			jniDebuggable true
			**SIGNCONFIG**
  		}
  		release {
 			minifyEnabled **MINIFY_RELEASE**
 			useProguard **PROGUARD_RELEASE**
  			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-unity.txt'**USER_PROGUARD**
  			**SIGNCONFIG**
  		}
	}
	
	signingConfigs {
		debug {
			v1SigningEnabled true
			v2SigningEnabled true
		}
		
		release {
			v1SigningEnabled true
			v2SigningEnabled true
		}
	}
  
**PACKAGING_OPTIONS****SPLITS**
**BUILT_APK_LOCATION**
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }
}


